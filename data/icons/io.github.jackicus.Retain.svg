<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- SPDX-License-Identifier: GPL-2.0-or-later -->
  <!-- SPDX-FileCopyrightText: 2026 Jack Tully -->
  <!-- Two index cards, the back one in GNOME blue and the front one paper white, carrying a
       sentence with a gap in it: a cloze, the kind of card the app is for. Physical objects,
       lit from above, standing on a darker side, as the HIG asks of an app icon. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="back-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c71d8"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f5f4"/>
    </linearGradient>
    <linearGradient id="front-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#deddda"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
    <linearGradient id="gap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#f8e45c"/>
    </linearGradient>
  </defs>

  <!-- The back card, turned a little, its side below it. -->
  <g transform="rotate(-9 64 60)">
    <rect x="18" y="26" width="92" height="64" rx="8" fill="url(#back-side)"/>
    <rect x="18" y="20" width="92" height="64" rx="8" fill="url(#back)"/>
    <rect x="18.5" y="20.5" width="91" height="63" rx="7.5" fill="none" stroke="#ffffff"
          stroke-opacity="0.35"/>
    <g fill="#ffffff" fill-opacity="0.55">
      <rect x="30" y="34" width="46" height="6" rx="3"/>
      <rect x="30" y="48" width="66" height="6" rx="3"/>
    </g>
  </g>

  <!-- The front card: its side, its face, and a sentence with one word hidden. -->
  <rect x="14" y="50" width="100" height="66" rx="8" fill="url(#front-side)"/>
  <rect x="14" y="44" width="100" height="66" rx="8" fill="url(#front)"/>
  <rect x="14.5" y="44.5" width="99" height="65" rx="7.5" fill="none" stroke="#000000"
        stroke-opacity="0.12"/>
  <g fill="#77767b">
    <rect x="26" y="58" width="52" height="7" rx="3.5"/>
    <rect x="84" y="58" width="18" height="7" rx="3.5"/>
    <rect x="26" y="74" width="20" height="7" rx="3.5"/>
    <rect x="80" y="74" width="22" height="7" rx="3.5"/>
    <rect x="26" y="90" width="40" height="7" rx="3.5"/>
  </g>
  <!-- The gap: the cloze, highlighted, with a dark line standing in for the word. -->
  <rect x="50" y="70" width="26" height="15" rx="4" fill="url(#gap)"/>
  <rect x="50.5" y="70.5" width="25" height="14" rx="3.5" fill="none" stroke="#e5a50a"
        stroke-opacity="0.8"/>
  <rect x="55" y="76" width="16" height="3" rx="1.5" fill="#3d3846"/>
</svg>
